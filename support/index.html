<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <style>
    /* ==============================================
       newカラーパレット & ベーススタイル
       ============================================== */
    :root {
      --color-main: #99AABB;         /* メインカラー */
      --color-main-hover: #8899AA;   /* ホバー時メイン */
      --color-highlight: #E2E8F0;    /* ハイライト */
      --color-shadow: #B0C4DE;       /* シャドウ / アクセント */
      --color-bg: #F0F4F8;           /* 白っぽいちょっと黒い水色 */
      --color-card-bg: #FFFFFF;      /* カード背景 */
      --color-text: #2D3748;         /* 主テキスト */
      --color-text-muted: #64748B;   /* 補足テキスト */
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* ==============================================
       お問い合わせカード
       ============================================== */
    .form-card {
      background: var(--color-card-bg);
      width: 100%;
      max-width: 560px;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 10px 30px -5px rgba(176, 196, 222, 0.3),
        0 20px 25px -5px rgba(153, 170, 187, 0.15);
      animation: fadeInSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--color-main), var(--color-shadow), var(--color-highlight));
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: 0.05em;
    }

    /* 注意事項エリア */
    .notice-box {
      background-color: #F8FAFC;
      border-left: 4px solid var(--color-shadow);
      padding: 1rem 1.25rem;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-bottom: 2rem;
      font-size: 0.88rem;
      color: var(--color-text-muted);
      animation: fadeIn 1s ease-out 0.2s both;
    }

    .notice-box h3 {
      font-size: 0.95rem;
      color: var(--color-text);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notice-box ul {
      padding-left: 1.2rem;
    }

    .notice-box li {
      margin-bottom: 0.4rem;
      word-break: break-all;
    }

    /* フォーム入力欄 */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      color: var(--color-text);
      background-color: #FAFCFF;
      border: 2px solid var(--color-highlight);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition-smooth);
      resize: vertical;
    }

    .form-control:focus {
      background-color: #FFFFFF;
      border-color: var(--color-main);
      box-shadow: 0 0 0 4px rgba(153, 170, 187, 0.25);
      transform: translateY(-2px);
    }

    .form-control:read-only {
      background-color: #EDF2F7;
      color: #4A5568;
      cursor: not-allowed;
      border-color: #CBD5E0;
    }

    textarea.form-control {
      min-height: 140px;
    }

    /* 送信ボタン */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #FFFFFF;
      background-color: var(--color-main);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 12px rgba(153, 170, 187, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover {
      background-color: var(--color-main-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(153, 170, 187, 0.5);
    }

    .btn-text, .send-icon {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      display: inline-block;
    }

    /* --- 紙飛行機送信アニメーション --- */
    .btn-submit.is-sending {
      pointer-events: none;
      background-color: var(--color-main-hover);
      box-shadow: 0 2px 8px rgba(153, 170, 187, 0.3);
      transform: scale(0.98);
    }

    .btn-submit.is-sending .btn-text {
      opacity: 0;
      transform: translateX(-15px);
    }

    .btn-submit.is-sending .send-icon {
      animation: flyAway 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes flyAway {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      30% { transform: translate(-5px, 5px) scale(0.9); }
      100% { transform: translate(120px, -60px) scale(1.2); opacity: 0; }
    }

    /* 送信完了メッセージ画面 */
    .completion-screen {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      animation: fadeIn 0.6s ease-out;
    }

    .completion-screen h2 {
      font-size: 1.5rem;
      color: var(--color-text);
      margin-bottom: 1rem;
    }

    .completion-screen p {
      color: var(--color-text-muted);
      font-size: 1rem;
    }

    /* ==============================================
       ローディング画面（指定デザイン）
       ============================================== */
    #first-loading-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #000000;
      z-index: 90000;
      display: none; /* 初期状態は非表示 */
      justify-content: center;
      align-items: center;
      overflow: hidden;
      pointer-events: auto;
    }

    .white-cover-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      clip-path: circle(0% at 50% 50%);
      z-index: 1;
    }

    .white-cover-overlay.shrink-in {
      animation: shrinkFromEdge 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes shrinkFromEdge {
      0% { clip-path: circle(0% at 50% 50%); }
      100% { clip-path: circle(150% at 50% 50%); }
    }

    #first-loading-screen.smooth-fade-out {
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    #first-loading-screen.smooth-fade-out .white-cover-overlay {
      clip-path: circle(0% at 50% 50%) !important;
      transition: clip-path 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    }

    .first-loading-content {
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    #first-loading-screen.smooth-fade-out .first-loading-content {
      opacity: 0;
    }

    .logo-container {
      width: 110px;
      height: 110px;
      margin-bottom: 25px;
      transform: scale(0);
      opacity: 0;
    }

    .logo-container.pop-in {
      animation: pyokonLogo 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.4) forwards;
    }

    @keyframes pyokonLogo {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      color: transparent;
    }

    .first-load-bar-track {
      width: 220px;
      height: 6px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .first-load-bar-track.show {
      opacity: 1;
    }

    .first-load-bar-fill {
      width: 0%;
      height: 100%;
      background: #c3d9f0;
      box-shadow: 0 0 10px #E2ECF7;
      border-radius: 10px;
      transition: width 1.5s cubic-bezier(0.1, 0.8, 0.2, 1);
    }

    /* アニメーション用基本フレーム */
    @keyframes fadeInSlideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake { animation: shake 0.4s ease-in-out; }
  </style>
</head>
<body>

  <!-- お問い合わせカード -->
  <div class="form-card" id="formCard">
    <div id="formSection">
      <h1 class="form-title">お問い合わせ</h1>

      <div class="notice-box">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          注意事項
        </h3>
        <p style="margin-bottom: 0.5rem; font-weight: 600;">送信ボタンを押されたら、次の条項に同意したことになります：</p>
        <ul id="noticeList"></ul>
      </div>

      <form id="contactForm">
        <div class="form-group">
          <label class="form-label" for="message">お問い合わせ内容</label>
          <textarea 
            id="message" 
            class="form-control" 
            placeholder="こちらにご質問やご要望を入力してください..." 
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">送信</span>
          <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>

    <!-- 送信完了画面 -->
    <div class="completion-screen" id="completionScreen">
      <h2>問い合わせました</h2>
      <p>画面を閉じてください</p>
    </div>
  </div>

  <!-- 送信処理中ローディング画面 -->
  <div id="first-loading-screen">
    <div class="white-cover-overlay" id="white-cover"></div>
    <div class="first-loading-content">
      <div class="logo-container" id="logo-box">
        <img src="https://files.catbox.moe/lzbie4.png" id="app-logo-img" class="logo-img" alt="Logo">
      </div>
      <div class="first-load-bar-track" id="first-bar-track">
        <div class="first-load-bar-fill" id="first-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    /* ==============================================
       コンフィグ設定
       ============================================== */
    const CONFIG = {
      recipientEmail: "tunaisinsekai@gmail.com",
      notices: [
        "にんにんにんにんにんにんにんにんにんにんにんにんにんにんにん",
        "営業や勧誘は一切受け付けておりません。送信1回ごとに地球温暖化が10％進行します。また送信5回ごとにあなたを食べに行きます🍴",
        "当チャンネル、またはサイトやサービスは個人運営ですので、優しくしていただかないと心が折れて無視や、メールアドレスを晒すなどの行為をするかもしれません。",
        "怪文書や非常識な文章はAIがブロックするため届きません。"
      ]
    };

    document.addEventListener("DOMContentLoaded", () => {
      // 1. 注意事項の自動注入
      const noticeList = document.getElementById("noticeList");
      CONFIG.notices.forEach(text => {
        const li = document.createElement("li");
        li.textContent = text;
        noticeList.appendChild(li);
      });

      // 2. URLハッシュ (/#送信内容) からの初期値設定＆編集不可化
      const messageInput = document.getElementById("message");
      if (window.location.hash) {
        // 先頭の "#" または "/#" を取り除く
        const hashText = decodeURIComponent(window.location.hash.replace(/^#\/?/, ""));
        if (hashText) {
          messageInput.value = hashText;
          messageInput.readOnly = true; // 編集不可にする
        }
      }
    });

    /* ==============================================
       フォーム送信処理
       ============================================== */
    const form = document.getElementById("contactForm");
    const messageInput = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const formCard = document.getElementById("formCard");
    const formSection = document.getElementById("formSection");
    const completionScreen = document.getElementById("completionScreen");

    let isSubmitting = false;

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (isSubmitting) return;

      const messageValue = messageInput.value.trim();

      if (!messageValue) {
        formCard.classList.add("shake");
        setTimeout(() => formCard.classList.remove("shake"), 400);
        return;
      }

      isSubmitting = true;

      // STEP 1: 紙飛行機アニメーション発動
      submitBtn.classList.add("is-sending");

      // STEP 2: 紙飛行機が飛び去った後にローディング画面を表示
      setTimeout(() => {
        runLoadingAnimation(() => {
          // STEP 3: ローディング完了後にメールアプリを開く
          const mailtoUrl = `mailto:${CONFIG.recipientEmail}?body=${encodeURIComponent(messageValue)}`;
          window.location.href = mailtoUrl;

          // STEP 4: 画面を「問い合わせました 画面を閉じてください」に変更
          formSection.style.display = "none";
          completionScreen.style.display = "block";
        });
      }, 750);
    });

    /* ==============================================
       ローディングアニメーションの再生
       ============================================== */
    function runLoadingAnimation(onComplete) {
      const loadingScreen = document.getElementById("first-loading-screen");
      const whiteCover = document.getElementById("white-cover");
      const logoBox = document.getElementById("logo-box");
      const firstBarTrack = document.getElementById("first-bar-track");
      const firstBarFill = document.getElementById("first-bar-fill");

      // リセット
      loadingScreen.style.display = "flex";
      loadingScreen.classList.remove("smooth-fade-out");
      whiteCover.classList.remove("shrink-in");
      logoBox.classList.remove("pop-in");
      firstBarTrack.classList.remove("show");
      firstBarFill.style.width = "0%";

      // アニメーションシーケンス
      // 1. ロゴ拡大出現
      setTimeout(() => {
        logoBox.classList.add("pop-in");
      }, 200);

      // 2. 白カバーで塗る
      setTimeout(() => {
        whiteCover.classList.add("shrink-in");
      }, 600);

      // 3. プログレスバー伸長
      setTimeout(() => {
        firstBarTrack.classList.add("show");
        setTimeout(() => {
          firstBarFill.style.width = "100%";
        }, 50);
      }, 1100);

      // 4. フェードアウト＆完了通知
      setTimeout(() => {
        loadingScreen.classList.add("smooth-fade-out");

        setTimeout(() => {
          loadingScreen.style.display = "none";
          if (onComplete) onComplete();
        }, 800);
      }, 2700);
    }
  </script>
</body>
</html>
