    body {

    /* ===== カスタムカーソル ===== */
    #custom-cursor {
      position: fixed; top: 0; left: 0;
      width: 12px; height: 12px;
      background-color: #c3d9f0;
      border: 1.5px solid #E2ECF7;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-50%, -50%);

      opacity: 0;
      transition: opacity 0.3s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease, border-color 0.2s ease;
      will-change: transform, left, top;
    }
    #custom-cursor.hover {
      transform: translate(-50%, -50%) scale(1.25);
      background-color: #E2ECF7; border-color: #fff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6), 0 0 12px #E2ECF7;
    }
    #custom-cursor.active { transform: translate(-50%, -50%) scale(0.85); background-color: #a1c4e6; }
    @media (hover: none), (pointer: coarse) {
      #custom-cursor { display: none !important; }
      html, body, * { cursor: auto !important; }
    }
    .bottom-cursor-guard {
      position: fixed; bottom: 0; left: 0;
      width: 100vw; height: 4px;
      z-index: 999990;
    }

    /* ===== 背景動画 ===== */
    .bg-video-container {
      position: fixed; inset: 0;
      z-index: -2; overflow: hidden; pointer-events: none;
    }
    .bg-video {
      position: absolute; top: 50%; left: 50%;
      width: max(120vw, 213.34vh); height: max(67.5vw, 120vh);
      transform: translate(-50%, -50%);
      border: 0; pointer-events: none; user-select: none;
    }
    .bg-video-fb { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .bg-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 10, 15, 0.6);
      z-index: -1; pointer-events: none;
    }

    /* ===== ハンバーガー ===== */
    .hamburger-btn {
      position: fixed; top: 20px; left: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 5px;
      transition: all 0.3s ease;
    }
    .hamburger-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }
    .hamburger-btn span { width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
    .hamburger-btn.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger-btn.active span:nth-child(2) { opacity: 0; }
    .hamburger-btn.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .menu-drawer {
      position: fixed; top: 0; left: -300px;
      width: 280px; height: 100%;
      background: rgba(15, 15, 25, 0.88);
      backdrop-filter: blur(20px);
      z-index: 999;
      padding: 80px 20px 30px;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      overflow-y: auto;
    }
    .menu-drawer.open { left: 0; }
    .menu-section-header {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; color: #8a8a9e;
      letter-spacing: 1px; margin: 20px 0 8px 12px;
    }
    .menu-drawer a {
      display: flex; align-items: center; gap: 12px;
      color: #e0e0e0; text-decoration: none;
      padding: 12px 14px; margin-bottom: 6px;
      border-radius: 10px; font-size: 0.95rem; font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }
    .menu-drawer a:hover { background: rgba(255, 255, 255, 0.2); color: #fff; transform: translateX(4px); }
    .menu-drawer svg { flex-shrink: 0; }
    .menu-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 998; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;

    .menu-overlay.open { opacity: 1; pointer-events: auto; }

      background: rgba(20, 20, 32, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px; margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      word-break: break-word;
    }
    .profile-header { text-align: center; }
    .avatar {
      width: 130px; height: 130px;
      border-radius: 50%; object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      -webkit-user-drag: none;
    }
    .user-name { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .details-row {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 12px; font-size: 0.95rem; color: #b0b0c0; margin-bottom: 16px;
    }
    .details-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bio { opacity: 0; transition: opacity 0.5s ease; font-size: 1rem; line-height: 1.7; color: #e0e0e0; margin-top: 16px; text-align: left; }

    .action-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .action-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; border-radius: 14px;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

    .action-btn svg { flex-shrink: 0; }

    .btn-support { background: linear-gradient(135deg, #341f97, #54a0ff); }
    .btn-friend  { background: linear-gradient(135deg, #10ac84, #1dd1a1); }
    .action-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }

    .section-title {
      font-size: 1.25rem; font-weight: 700;
      margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; gap: 8px;
    }
    .sns-group { display: flex; flex-direction: column; gap: 10px; }
    .sns-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px; text-decoration: none; color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }
    .sns-item-left { display: flex; align-items: center; gap: 10px; }
    .sns-item-left svg { flex-shrink: 0; }
    .sns-item:hover { background: rgba(255, 255, 255, 0.12); transform: translateX(4px); }
    .sns-handle { font-size: 0.9rem; color: #a0a0b0; }

    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 8px;
      font-size: 0.88rem; font-weight: 500;
    }
    .tag-like { background: rgba(46, 213, 115, 0.15); color: #7bed9f; border: 1px solid rgba(46, 213, 115, 0.3); }
    .tag-dislike { background: rgba(255, 71, 87, 0.15); color: #ff6b81; border: 1px solid rgba(255, 71, 87, 0.3); }

    /* ===== 深夜だけ現れるボタン ===== */
    .menu-drawer a.night-btn {
      position: relative; overflow: visible;
      margin-top: 26px; margin-bottom: 44px;
      color: #ffd9d9;
      background: linear-gradient(180deg, #5c0000, #270000);
      border: 1px solid #8b0000;
      box-shadow: 0 0 14px rgba(190, 0, 0, 0.6), inset 0 0 14px rgba(0, 0, 0, 0.65);
      text-shadow: 2px 0 #ff1a1a, -2px 0 #3a0000;
      font-family: 'Courier New', monospace;
      animation: nightPulse 2.4s ease-in-out infinite, nightShake 3.3s steps(1) infinite;
    }
    .menu-drawer a.night-btn:hover { background: linear-gradient(180deg, #7a0000, #330000); transform: none; filter: brightness(1.2); }
    .night-btn .night-txt { font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
    .night-btn::after {
      content: ''; position: absolute; left: 6px; right: 6px; bottom: -2px; height: 5px;
      background: #a30000; border-radius: 0 0 8px 8px;
    }
    .night-drip {
      position: absolute; top: calc(100% + 1px); width: 6px; height: 0;
      background: #a30000; border-radius: 0 0 6px 6px;
      box-shadow: 0 0 6px rgba(160, 0, 0, 0.7);
      animation: nightDrip 3.6s ease-in infinite;
    }
    .night-drip:nth-of-type(1) { left: 16%; animation-delay: 0s; }
    .night-drip:nth-of-type(2) { left: 48%; animation-delay: 1.3s; width: 5px; }
    .night-drip:nth-of-type(3) { left: 79%; animation-delay: 2.2s; width: 7px; }
    @keyframes nightDrip {
      0% { height: 0; opacity: 1; }
      60% { height: 26px; opacity: 1; }
      85% { height: 30px; opacity: 0.9; }
      100% { height: 34px; opacity: 0; }
    }
    @keyframes nightPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(190, 0, 0, 0.45), inset 0 0 14px rgba(0, 0, 0, 0.65); }
      50% { box-shadow: 0 0 22px rgba(230, 0, 0, 0.85), inset 0 0 14px rgba(0, 0, 0, 0.65); }
    }
    @keyframes nightShake {
      0%, 90%, 100% { transform: none; }
      91% { transform: translate(2px, -1px); }
      93% { transform: translate(-3px, 1px) skewX(6deg); }
      95% { transform: translate(1px, 0); }
    }

    /* ===== 深夜ボタンの演出 ===== */
    #scare {
      position: fixed; inset: 0; z-index: 2147483500;
      background: #000; opacity: 0; transition: opacity 0.9s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; overflow: hidden; padding: 24px; text-align: center;
      color: #b00000; font-family: 'Courier New', monospace;
    }
    #scare.on { opacity: 1; }
    #scare.shake { animation: scShake 0.09s linear infinite; }
    @keyframes scShake {
      0% { transform: translate(0, 0); } 25% { transform: translate(-3px, 2px); }
      50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, -3px); }
      100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) { #scare.shake { animation: none; } }
    .sc-vig { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(120, 0, 0, 0.55) 100%);
      animation: scVig 3s ease-in-out infinite; }
    @keyframes scVig { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .sc-scan { position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 3px); }
    .sc-time { position: relative; font-size: 1rem; letter-spacing: 0.3em; opacity: 0; transition: opacity 1.2s; }
    .sc-time.on { opacity: 0.8; }
    .sc-lines { position: relative; display: flex; flex-direction: column; gap: 14px; }
    .sc-line { opacity: 0; transition: opacity 1.2s; font-size: 1.3rem; letter-spacing: 0.12em; text-shadow: 0 0 8px rgba(200, 0, 0, 0.7); }
    .sc-line.on { opacity: 1; }
    .sc-line.sc-red { color: #d11; }
    .sc-line.sc-big { font-size: 2.4rem; color: #f00; font-weight: 700; text-shadow: 3px 0 #400, -3px 0 #f00, 0 0 18px rgba(255, 0, 0, 0.8); }
    .sc-eyes { position: absolute; inset: 0; opacity: 0; transition: none; background: radial-gradient(circle, #2a0000, #000 75%); }
    .sc-eyes svg { width: 100%; height: 100%; display: block; }
    #scare.flash .sc-eyes { opacity: 1; }
    #scare.flash .sc-lines, #scare.flash .sc-time { opacity: 0; }
    #scare.black > * { opacity: 0 !important; transition: none; }

    /* 演出の追加分 */
    #scare .sc-vig { animation: scFlick 2.6s steps(1) infinite; }
    @keyframes scFlick {
      0% { opacity: 0.9; } 18% { opacity: 0.45; } 22% { opacity: 1; } 47% { opacity: 0.6; }
      52% { opacity: 0.25; } 56% { opacity: 0.95; } 80% { opacity: 0.55; } 100% { opacity: 0.9; }
    }
    .sc-noise { position: absolute; inset: -10%; pointer-events: none; opacity: 0.16; background-size: 96px 96px; animation: scNoise 0.5s steps(4) infinite; }
    @keyframes scNoise { 0% { transform: translate(0, 0); } 25% { transform: translate(-7%, 4%); } 50% { transform: translate(5%, -6%); } 75% { transform: translate(-4%, -3%); } 100% { transform: translate(0, 0); } }
    #scare .sc-line { animation: scGlitch 2.4s steps(1) infinite; }
    @keyframes scGlitch {
      0%, 88%, 100% { transform: none; }
      89% { transform: translate(4px, 0) skewX(-8deg); filter: hue-rotate(-20deg); }
      91% { transform: translate(-5px, 1px); }
      93% { transform: none; }
    }
    #scare.quiet .sc-lines, #scare.quiet .sc-time { opacity: 0; transition: opacity 0.2s; }
    #scare.quiet .sc-vig { animation: none; opacity: 0.12; }
    #scare.thump { animation: scThump 0.16s ease-out; }
    @keyframes scThump { 0% { transform: translate(0, 5px) scale(1.015); } 100% { transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .sc-noise, #scare .sc-line, #scare .sc-vig { animation: none; }
    }

    .footer { text-align: center; font-size: 0.8rem; color: #8a8a9e; padding: 0 20px 40px; }

    @media (max-width: 600px) {
      .container { padding: 70px 12px 30px; }
      .card { padding: 20px 16px; border-radius: 18px; }
      .action-group { grid-template-columns: 1fr; }
      .user-name { font-size: 1.6rem; }
      .avatar { width: 100px; height: 100px; }
      .sns-item { padding: 12px 14px; }
      .sns-handle { font-size: 0.8rem; }
    }
  </style>
</head>

  <script>
    // ===== 右クリック・コピー系の抑止 =====
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("dragstart", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (e.key === "F12") return e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && ["u", "s"].includes(k)) return e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].includes(k)) return e.preventDefault();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const cursor = document.getElementById("custom-cursor");
      let mouseX = -100, mouseY = -100, cursorX = -100, cursorY = -100;
      const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
      const hoverSel = "a, button, .hamburger-btn, .sns-item, .action-btn, .tag";

      if (!isTouch) {
        document.addEventListener("mousemove", e => { mouseX = e.clientX; mouseY = e.clientY; });
        document.addEventListener("mouseleave", () => { cursor.style.opacity = "0"; });
        document.addEventListener("mouseenter", () => { cursor.style.opacity = "1"; });
        (function animateCursor() {
          cursorX += (mouseX - cursorX) * 0.22;
          cursorY += (mouseY - cursorY) * 0.22;
          cursor.style.left = cursorX + "px";
          cursor.style.top = cursorY + "px";
          requestAnimationFrame(animateCursor);
        })();
        document.addEventListener("mousedown", () => cursor.classList.add("active"));
        document.addEventListener("mouseup", () => cursor.classList.remove("active"));
        document.addEventListener("mouseover", e => { if (e.target.closest(hoverSel)) cursor.classList.add("hover"); });
        document.addEventListener("mouseout", e => { if (e.target.closest(hoverSel)) cursor.classList.remove("hover"); });
      }

      // ローディング終了後にカーソルを表示
      const showCursor = () => { if (!isTouch) cursor.style.opacity = "1"; };
      if (window.__plDone) showCursor(); else window.addEventListener("pl:done", showCursor);

      // ===== 設定の反映 =====
      const cfg = SITE_CONFIG;

      // 背景: YouTube埋め込み(ループ・ミュート・UI非表示)
      // 「動画プレイヤーの設定エラー(153)」などで再生できない場合は、予備の動画に切り替える
      const bgFrame = document.getElementById("bgVideo");
      const yt = cfg.bgYoutubeId;
      let bgFallbackDone = false;
      function bgFallback() {
        if (bgFallbackDone) return;
        bgFallbackDone = true;
        if (!cfg.bgVideoUrl) return;
        const v = document.createElement("video");
        v.className = "bg-video-fb";
        v.src = cfg.bgVideoUrl;
        v.autoplay = true; v.loop = true; v.muted = true; v.controls = false;
        v.setAttribute("playsinline", "");
        v.setAttribute("disablePictureInPicture", "");
        v.addEventListener("contextmenu", e => e.preventDefault());
        bgFrame.replaceWith(v);
        v.play().catch(() => {
          document.addEventListener("click", () => v.play(), { once: true });
          document.addEventListener("touchstart", () => v.play(), { once: true });
        });
      }
      if (yt) {
        const params = {
          autoplay: "1", mute: "1", controls: "0", loop: "1", playlist: yt,
          modestbranding: "1", rel: "0", playsinline: "1", disablekb: "1",
          fs: "0", iv_load_policy: "3", cc_load_policy: "0", enablejsapi: "1"
        };
        if (/^https?:$/.test(location.protocol)) params.origin = location.origin;
        // YouTube側のエラー通知を受け取る
        window.addEventListener("message", (e) => {
          if (!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname)) return;
          try {
            const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
            if (d && d.event === "onError") bgFallback();
          } catch (err) {}
        });
        bgFrame.addEventListener("load", () => {
          try { bgFrame.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*"); } catch (err) {}
        });
        bgFrame.src = `https://www.youtube.com/embed/${yt}?${new URLSearchParams(params).toString()}`;
        // file:// で開いている場合、YouTubeは必ず設定エラーになるので最初から予備に切り替える
        if (location.protocol === "file:") bgFallback();
      } else {
        bgFallback();
      }

      document.getElementById("userIcon").src = cfg.iconUrl;
      document.getElementById("userName").textContent = cfg.name;
      document.getElementById("userBirthday").textContent = cfg.birthday;
      document.getElementById("userOshi").textContent = cfg.oshi;

      const defaultExternalSvg = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
      const defaultTagSvg = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>`;

      const isInternal = u => {
        try {
          const h = new URL(u, location.href).host;
          return h === location.host || (cfg.internalHosts || []).includes(h);
        } catch (e) { return false; }
      };
      function setLink(a, url) {
        a.href = url;
        if (url.startsWith("#")) { a.addEventListener("click", closeMenu); return; }
        if (isInternal(url)) return; // 同じタブで開く(遷移ローディングが入る)
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }

      const actionGroup = document.getElementById("actionButtons");
      cfg.actionButtons.forEach(btn => {
        const a = document.createElement("a");
        a.className = `action-btn ${btn.class || ""}`;
        a.innerHTML = `${btn.svgIcon || defaultExternalSvg} <span>${btn.label}</span>`;
        setLink(a, btn.url);
        actionGroup.appendChild(a);
      });

      const snsGroup = document.getElementById("snsList");
      cfg.sns.forEach(sns => {
        const a = document.createElement("a");
        a.href = sns.url;
        a.className = "sns-item";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML = `
          <div class="sns-item-left">${sns.svgIcon || defaultExternalSvg}<strong>${sns.name}</strong></div>
          <span class="sns-handle">${sns.handle}</span>`;
        snsGroup.appendChild(a);
      });

      function fillTags(containerId, items, cls) {
        const box = document.getElementById(containerId);
        items.forEach(item => {
          const span = document.createElement("span");
          span.className = `tag ${cls}`;
          span.innerHTML = `${defaultTagSvg} `;
          span.appendChild(document.createTextNode(item));
          box.appendChild(span);
        });
      }
      fillTags("likeTags", cfg.likes, "tag-like");
      fillTags("dislikeTags", cfg.dislikes, "tag-dislike");

      // ===== 一言(プロフィールの紹介文の部分。admin.htmlで更新できる) =====
      const hk = cfg.hitokoto || {};
      const bioEl = document.getElementById("userBio");
      const showBio = (text) => {
        bioEl.textContent = text || hk.fallback || cfg.bio || "";
        bioEl.style.opacity = "1";
      };
      (async () => {
        try {
          const url = hk.api ? hk.api : `${hk.file || "hitokoto.json"}?t=${Date.now()}`;
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) throw new Error(r.status);
          const data = await r.json();
          showBio(data && data.text);
        } catch (e) {
          showBio("");
        }
      })();

      // ===== メニュー =====
      const menuToggle = document.getElementById("menuToggle");
      const menuOverlay = document.getElementById("menuOverlay");
      const menuDrawer = document.getElementById("menuDrawer");

      function openMenu() {
        menuToggle.classList.add("active");
        menuDrawer.classList.add("open");
        menuOverlay.classList.add("open");
      }
      function closeMenu() {
        menuToggle.classList.remove("active");
        menuDrawer.classList.remove("open");
        menuOverlay.classList.remove("open");
      }

      cfg.menuSections.forEach(section => {
        const header = document.createElement("div");
        header.className = "menu-section-header";
        header.textContent = section.title;
        menuDrawer.appendChild(header);

        section.links.forEach(link => {
          const a = document.createElement("a");
          a.innerHTML = `${link.svgIcon || defaultExternalSvg} <span>${link.label}</span>`;
          setLink(a, link.url);
          menuDrawer.appendChild(a);
        });
      });

      menuToggle.addEventListener("click", () => {
        menuDrawer.classList.contains("open") ? closeMenu() : openMenu();
      });
      menuOverlay.addEventListener("click", closeMenu);

      // ===== 深夜(1:00〜4:00)だけメニューに現れるボタン =====
      const nb = cfg.nightButton;
      if (nb && nb.enabled !== false) {
        let node = null, glitchTimer = null, scaring = false, endScare = null;
        const base = nb.garbled || "陝ｿ縺ｧ譟薙∪縺｣縺ｦ縺・ｋ";
        const junk = "縺繧蜊繝ｿ譁蟄怜喧縺代蛻縺ｮ逕ｻ▓▒░█ÆØ¥§Ω�";
        const z2 = n => String(n).padStart(2, "0");
        const inWindow = () => {
          const h = new Date().getHours();
          const s0 = nb.startHour ?? 1, e0 = nb.endHour ?? 4;
          return s0 <= e0 ? (h >= s0 && h < e0) : (h >= s0 || h < e0);
        };
        // 元の読める文字は一度も出さない。文字化け文字の一部をさらに崩し続ける
        const garble = (src) => Array.from(src).map(ch =>
          Math.random() < 0.35 ? junk[Math.floor(Math.random() * junk.length)] : ch
        ).join("");

        // ---- 怖い演出 ----
        function makeSound() {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC || nb.sound === false) return null;
          try {
            const ctx = new AC();
            const master = ctx.createGain();
            master.gain.value = 0.5;
            master.connect(ctx.destination);

            const noiseBuf = (sec) => {
              const len = Math.floor(ctx.sampleRate * sec);
              const buf = ctx.createBuffer(1, len, ctx.sampleRate);
              const data = buf.getChannelData(0);
              for (let k = 0; k < len; k++) data[k] = Math.random() * 2 - 1;
              return buf;
            };
            const thump = (when, vol) => {
              const o = ctx.createOscillator(), g = ctx.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(70, when);
              o.frequency.exponentialRampToValueAtTime(38, when + 0.18);
              g.gain.setValueAtTime(0.0001, when);
              g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, when + 0.28);
              o.connect(g); g.connect(master);
              o.start(when); o.stop(when + 0.3);
            };
            // 低いうなり(じわじわ大きく、少し音程も上がる)
            const d = ctx.createOscillator(), dg = ctx.createGain(), lp = ctx.createBiquadFilter();
            d.type = "sawtooth"; d.frequency.setValueAtTime(46, ctx.currentTime);
            d.frequency.linearRampToValueAtTime(58, ctx.currentTime + 5);
            lp.type = "lowpass"; lp.frequency.value = 180;
            dg.gain.setValueAtTime(0.0001, ctx.currentTime);
            dg.gain.linearRampToValueAtTime(0.11, ctx.currentTime + 4);
            d.connect(lp); lp.connect(dg); dg.connect(master);
            d.start();

            let beatTimer = null;
            const beat = (ms) => {
              clearInterval(beatTimer);
              const once = () => { const t = ctx.currentTime; thump(t, 0.8); thump(t + 0.22, 0.55); };
              once();
              beatTimer = setInterval(once, ms);
            };
            // 耳元のささやき(左右どちらかから)
            const whisper = () => {
              const dur = 2.6, t0 = ctx.currentTime;
              const src = ctx.createBufferSource(); src.buffer = noiseBuf(dur);
              const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 2.2;
              const g = ctx.createGain();
              g.gain.setValueAtTime(0.0001, t0);
              let tt = 0;
              while (tt < dur - 0.4) {
                g.gain.linearRampToValueAtTime(0.06 + Math.random() * 0.07, t0 + tt + 0.12);
                g.gain.linearRampToValueAtTime(0.004, t0 + tt + 0.3 + Math.random() * 0.15);
                tt += 0.35 + Math.random() * 0.25;
              }
              g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
              src.connect(bp); bp.connect(g);
              if (ctx.createStereoPanner) {
                const pan = ctx.createStereoPanner();
                pan.pan.value = Math.random() < 0.5 ? -0.9 : 0.9;
                g.connect(pan); pan.connect(master);
              } else { g.connect(master); }
              src.start(t0);
            };
            // 扉を叩く音
            const knock = () => {
              const t = ctx.currentTime;
              const o = ctx.createOscillator(), g = ctx.createGain();
              o.type = "triangle";
              o.frequency.setValueAtTime(140, t);
              o.frequency.exponentialRampToValueAtTime(55, t + 0.1);
              g.gain.setValueAtTime(0.9, t);
              g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
              o.connect(g); g.connect(master);
              o.start(t); o.stop(t + 0.22);
              const n = ctx.createBufferSource(); n.buffer = noiseBuf(0.05);
              const nl = ctx.createBiquadFilter(); nl.type = "lowpass"; nl.frequency.value = 900;
              const ng = ctx.createGain(); ng.gain.value = 0.5;
              n.connect(nl); nl.connect(ng); ng.connect(master); n.start(t);
            };
            // 近づいてくる足音(だんだん大きくなる)
            const steps = (count, gap) => {
              for (let k = 0; k < count; k++) {
                const t = ctx.currentTime + k * gap;
                const vol = 0.25 + 0.6 * (k / (count - 1));
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = "sine";
                o.frequency.setValueAtTime(95, t);
                o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
                o.connect(g);
                if (ctx.createStereoPanner) {
                  const pan = ctx.createStereoPanner();
                  pan.pan.value = k % 2 ? 0.3 : -0.3;
                  g.connect(pan); pan.connect(master);
                } else { g.connect(master); }
                o.start(t); o.stop(t + 0.22);
                const nz = ctx.createBufferSource(); nz.buffer = noiseBuf(0.06);
                const lp2 = ctx.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 500;
                const ng = ctx.createGain(); ng.gain.value = vol * 0.5;
                nz.connect(lp2); lp2.connect(ng); ng.connect(master); nz.start(t);
              }
            };
            // 扉が軋む音
            const creak = () => {
              const t = ctx.currentTime;
              const o = ctx.createOscillator(); o.type = "sawtooth";
              o.frequency.setValueAtTime(90, t);
              o.frequency.linearRampToValueAtTime(140, t + 0.5);
              o.frequency.linearRampToValueAtTime(75, t + 1.3);
              const lfo = ctx.createOscillator(), lg = ctx.createGain();
              lfo.frequency.value = 17; lg.gain.value = 9;
              lfo.connect(lg); lg.connect(o.frequency);
              const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 6;
              bp.frequency.setValueAtTime(400, t);
              bp.frequency.linearRampToValueAtTime(1100, t + 0.6);
              bp.frequency.linearRampToValueAtTime(350, t + 1.3);
              const g = ctx.createGain();
              g.gain.setValueAtTime(0.0001, t);
              g.gain.linearRampToValueAtTime(0.1, t + 0.25);
              g.gain.linearRampToValueAtTime(0.0001, t + 1.35);
              o.connect(bp); bp.connect(g); g.connect(master);
              o.start(t); lfo.start(t); o.stop(t + 1.4); lfo.stop(t + 1.4);
            };
            // 急に無音になる
            const silence = () => {
              clearInterval(beatTimer);
              try {
                dg.gain.cancelScheduledValues(ctx.currentTime);
                dg.gain.setValueAtTime(dg.gain.value, ctx.currentTime);
                dg.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
              } catch (e) {}
            };
            const burst = () => {
              const src = ctx.createBufferSource(); src.buffer = noiseBuf(0.7);
              const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 600;
              const g = ctx.createGain();
              g.gain.setValueAtTime(0.45, ctx.currentTime);
              g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.7);
              src.connect(hp); hp.connect(g); g.connect(master); src.start();
              const o = ctx.createOscillator(), og = ctx.createGain();
              o.type = "sawtooth";
              o.frequency.setValueAtTime(700, ctx.currentTime);
              o.frequency.exponentialRampToValueAtTime(2400, ctx.currentTime + 0.6);
              og.gain.setValueAtTime(0.12, ctx.currentTime);
              og.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.65);
              o.connect(og); og.connect(master);
              o.start(); o.stop(ctx.currentTime + 0.7);
            };
            const stop = () => {
              clearInterval(beatTimer);
              try { master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.25); } catch (e) {}
              setTimeout(() => { try { d.stop(); ctx.close(); } catch (e) {} }, 400);
            };
            beat(1100);
            return { beat, whisper, knock, silence, burst, stop, steps, creak };
          } catch (e) { return null; }
        }

        // 画面のざらざらノイズ
        function noiseURL() {
          const c = document.createElement("canvas");
          c.width = c.height = 96;
          const x = c.getContext("2d");
          const img = x.createImageData(96, 96);
          for (let k = 0; k < img.data.length; k += 4) {
            const v = Math.random() * 255;
            img.data[k] = img.data[k + 1] = img.data[k + 2] = v;
            img.data[k + 3] = Math.random() * 90;
          }
          x.putImageData(img, 0, 0);
          return c.toDataURL();
        }

        function startScare(e) {
          e.preventDefault();
          if (scaring) return;
          scaring = true;
          closeMenu();
          const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const timers = [], intervals = [];
          const T = (ms, fn) => timers.push(setTimeout(fn, ms));

          const sc = document.createElement("div");
          sc.id = "scare";
          sc.innerHTML = '<div class="sc-vig"></div><div class="sc-scan"></div><div class="sc-noise"></div><div class="sc-time"></div><div class="sc-lines"></div>';
          document.body.appendChild(sc);
          requestAnimationFrame(() => requestAnimationFrame(() => sc.classList.add("on")));

          sc.querySelector(".sc-noise").style.backgroundImage = `url(${noiseURL()})`;
          const snd = makeSound();
          const timeEl = sc.querySelector(".sc-time");
          const lines = sc.querySelector(".sc-lines");
          const addLine = (text, cls, glitch) => {
            const d = document.createElement("div");
            d.className = "sc-line " + (cls || "");
            d.textContent = text;
            lines.appendChild(d);
            requestAnimationFrame(() => d.classList.add("on"));
            if (glitch) intervals.push(setInterval(() => { d.textContent = garble(text); }, 110));
          };

          endScare = () => {
            timers.forEach(clearTimeout);
            intervals.forEach(clearInterval);
            if (snd) snd.stop();
            sc.remove();
            scaring = false;
            endScare = null;
          };

          const knock = () => {
            if (snd) snd.knock();
            if (!reduce) { sc.classList.add("thump"); setTimeout(() => sc.classList.remove("thump"), 160); }
          };
          // 文字も絵も出さない。暗闇と音だけ
          T(1600, () => { if (snd) snd.whisper(); });
          T(2900, () => { if (snd) snd.creak(); });
          T(3400, () => { if (snd) snd.steps(6, 0.34); });   // 近づいてくる足音
          T(4400, () => { if (snd) snd.whisper(); });
          // ぴたりと全部止まって、完全な無音
          T(5400, () => {
            sc.classList.add("quiet");
            if (snd) snd.silence();
          });
          // コン、コン、コン
          T(6500, knock);
          T(7000, knock);
          T(7500, knock);
          // 鼓動だけが速くなって、画面が震える
          T(8300, () => {
            sc.classList.remove("quiet");
            if (!reduce) sc.classList.add("shake");
            if (snd) snd.beat(460);
          });
          // 突然の大きな音と同時に、ぶつっと真っ暗
          T(9300, () => {
            sc.classList.remove("shake");
            sc.classList.add("black");
            if (snd) snd.burst();
          });
          T(10100, () => { if (snd) snd.stop(); });
          T(10300, () => {
            const url = nb.url || "/";
            if (window.PageLoader) window.PageLoader.go(url);
            else location.href = url;
          });
        }

        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && endScare) endScare(); });
        // 戻るボタンで戻ってきたとき、演出の画面が残らないように
        window.addEventListener("pageshow", (e) => { if (e.persisted && endScare) endScare(); });

        // ---- ボタン本体 ----
        const showNight = () => {
          node = document.createElement("a");
          node.className = "night-btn";
          node.href = nb.url || "#";
          node.setAttribute("data-no-transition", "");
          node.innerHTML =
            `<svg viewBox="0 0 24 24" width="18" height="18" fill="#c40000"><path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>` +
            `<span class="night-txt"></span>` +
            `<i class="night-drip"></i><i class="night-drip"></i><i class="night-drip"></i>`;
          node.addEventListener("click", startScare);
          const txt = node.querySelector(".night-txt");
          txt.textContent = garble(base);
          glitchTimer = setInterval(() => { txt.textContent = garble(base); }, 90);
          menuDrawer.appendChild(node);
        };
        const hideNight = () => {
          clearInterval(glitchTimer);
          if (node) node.remove();
          node = null;
        };
        const checkNight = () => {
          const ok = inWindow();
          if (ok && !node) showNight();
          else if (!ok && node) hideNight();
        };
        checkNight();
        setInterval(checkNight, 20000);
      }
    });
  </script>
</body>
</html>
