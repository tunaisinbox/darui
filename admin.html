<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>一言を更新</title>
  <noscript>
    <style>
      html, body { background: #000 !important; overflow: hidden !important; }
      body > *:not(noscript) { display: none !important; }
      #nojs { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
              background: #000; color: #fff; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; }
      #nojs h1 { font-size: 1.3rem; color: #ff6b81; }
      #nojs p { font-size: 0.95rem; line-height: 1.8; color: #cfcfdc; max-width: 440px; }
    </style>
  </noscript>
  <script>document.write('<script src="loader.js?v=' + Date.now() + '"><\/script>');</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      color: #fff; min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1c2436 0%, #090b12 70%) fixed;
      padding: 40px 16px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .card {
      background: rgba(20, 20, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 24px; margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.05rem; margin-bottom: 14px; }
    .sub { font-size: 0.85rem; color: #8a8a9e; margin-bottom: 20px; }
    label { display: block; font-size: 0.82rem; color: #a0a0b0; margin-bottom: 6px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff; font-size: 1rem; font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #c3d9f0; }
    textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.8rem; color: #8a8a9e; }
    .field { margin-bottom: 16px; }
    button {
      padding: 12px 22px; border: 0; border-radius: 12px; cursor: pointer;
      font-weight: 700; font-size: 0.95rem; color: #fff;
      background: linear-gradient(135deg, #341f97, #54a0ff);
      transition: filter .2s, transform .2s;
    }
    button:hover { filter: brightness(1.15); transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    button.ghost { background: rgba(255, 255, 255, 0.08); font-weight: 500; padding: 6px 12px; font-size: 0.8rem; }
    .status { margin-top: 14px; font-size: 0.88rem; min-height: 1.2em; }
    .ok { color: #7bed9f; } .err { color: #ff6b81; } .info { color: #c3d9f0; }
    .preview { padding: 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); white-space: pre-wrap; line-height: 1.8; min-height: 3em; }
    .preview small { display: block; margin-top: 8px; color: #7c7c90; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    li { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); font-size: 0.9rem; white-space: pre-wrap; }
    li small { display: block; margin-top: 4px; font-size: 0.72rem; color: #7c7c90; }
    .mode { display: inline-block; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.08); color: #c3d9f0; margin-left: 8px; vertical-align: middle; }
    .note { font-size: 0.8rem; color: #8a8a9e; line-height: 1.7; margin-top: 12px; }
    a { color: #c3d9f0; }
  </style>
</head>
<body>
  <noscript>
    <div id="nojs">
      <h1>JavaScriptが無効になっています</h1>
      <p>このページはJavaScriptを使用しています。<br>ブラウザの設定でJavaScriptを有効にしてから、ページを再読み込みしてください。</p>
      <p style="font-size:0.8rem;color:#8a8a9e">JavaScript is disabled. Please enable JavaScript in your browser settings and reload this page.</p>
    </div>
  </noscript>

  <div class="wrap">
    <div class="card">
      <h1>一言を更新 <span class="mode" id="modeBadge"></span></h1>
      <p class="sub"><a href="index.html">← プロフィールに戻る</a></p>

      <div class="field" id="pwField" hidden>
        <label for="pw">パスワード</label>
        <input id="pw" type="password" autocomplete="current-password">
      </div>

      <div class="field">
        <label for="text">新しい一言</label>
        <textarea id="text" maxlength="120" placeholder="いまの気持ちとか、お知らせとか"></textarea>
        <div class="row"><span id="current"></span><span id="count">0 / 120</span></div>
      </div>

      <button id="save">更新する</button>
      <div class="status" id="status"></div>
      <p class="note" id="note"></p>
    </div>

    <div class="card">
      <h2>いまの表示</h2>
      <div class="preview" id="preview">読み込み中…</div>
    </div>

    <div class="card">
      <h2>過去の一言</h2>
      <ul id="history"></ul>
    </div>
  </div>

  <script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
  <script>
    const hk = (typeof SITE_CONFIG !== "undefined" && SITE_CONFIG.hitokoto) || {};
    const useApi = !!hk.api;
    const MAX_HISTORY = 10;
    let data = { text: "", updatedAt: null, history: [] };

    const $ = id => document.getElementById(id);
    const z = n => String(n).padStart(2, "0");
    const fmt = iso => {
      const d = new Date(iso);
      if (!iso || isNaN(d)) return "";
      return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
    };
    function say(msg, cls) { $("status").className = "status " + (cls || ""); $("status").textContent = msg; }

    // ---- 画面の初期化 ----
    $("modeBadge").textContent = useApi ? "即時更新モード" : "ファイル方式";
    $("pwField").hidden = !useApi;
    $("note").textContent = useApi
      ? "「更新する」を押すとすぐにサイトへ反映されます。"
      : "「更新する」を押すと新しい hitokoto.json がダウンロードされます。それを index.html と同じ場所にアップロードして上書きすると反映されます。";

    $("text").addEventListener("input", () => { $("count").textContent = `${$("text").value.length} / 120`; });

    function render() {
      $("current").textContent = data.updatedAt ? `最終更新: ${fmt(data.updatedAt)}` : "";
      $("preview").innerHTML = "";
      $("preview").appendChild(document.createTextNode(data.text || "（まだ一言がありません）"));
      if (data.updatedAt) {
        const s = document.createElement("small");
        s.textContent = `更新: ${fmt(data.updatedAt)}`;
        $("preview").appendChild(s);
      }
      const ul = $("history");
      ul.innerHTML = "";
      if (!data.history.length) {
        const li = document.createElement("li");
        li.textContent = "まだありません";
        ul.appendChild(li);
      }
      data.history.forEach((h, i) => {
        const li = document.createElement("li");
        const box = document.createElement("div");
        box.appendChild(document.createTextNode(h.text));
        const small = document.createElement("small");
        small.textContent = fmt(h.at);
        box.appendChild(small);
        const del = document.createElement("button");
        del.className = "ghost";
        del.textContent = "削除";
        del.addEventListener("click", () => removeHistory(i));
        li.appendChild(box);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    // ---- 読み込み ----
    async function load() {
      try {
        const url = useApi ? hk.api : `${hk.file || "hitokoto.json"}?t=${Date.now()}`;
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        data = { text: j.text || "", updatedAt: j.updatedAt || null, history: Array.isArray(j.history) ? j.history : [] };
        $("text").value = data.text;
        $("count").textContent = `${data.text.length} / 120`;
      } catch (e) {
        say("現在の一言を読み込めませんでした(新規として扱います)", "info");
      }
      render();
    }

    // ---- 保存 ----
    async function persist() {
      if (useApi) {
        const pw = $("pw").value;
        if (!pw) throw new Error("パスワードを入力してください");
        const r = await fetch(hk.api, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + pw },
          body: JSON.stringify(data)
        });
        if (r.status === 401) throw new Error("パスワードが違います");
        if (!r.ok) throw new Error("保存に失敗しました (" + r.status + ")");
        return "更新しました。サイトに反映されています。";
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hitokoto.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return "hitokoto.json をダウンロードしました。サイトにアップロードして上書きしてください。";
    }

    async function run(mutate) {
      const backup = JSON.stringify(data);
      $("save").disabled = true;
      say("処理中…", "info");
      try {
        mutate();
        const msg = await persist();
        render();
        say(msg, "ok");
      } catch (e) {
        data = JSON.parse(backup); // 失敗したら元に戻す
        render();
        say(e.message || "エラーが発生しました", "err");
      } finally {
        $("save").disabled = false;
      }
    }

    $("save").addEventListener("click", () => {
      const text = $("text").value.trim();
      if (!text) return say("一言を入力してください", "err");
      if (text === data.text) return say("いまの一言と同じです", "err");
      run(() => {
        if (data.text) data.history.unshift({ text: data.text, at: data.updatedAt || new Date().toISOString() });
        data.history = data.history.slice(0, MAX_HISTORY);
        data.text = text;
        data.updatedAt = new Date().toISOString();
      });
    });

    function removeHistory(i) {
      if (!confirm("この履歴を削除しますか?")) return;
      run(() => { data.history.splice(i, 1); });
    }

    load();
  </script>
</body>
</html>
